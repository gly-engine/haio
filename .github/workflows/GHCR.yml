name: ghcr

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - 
        uses: actions/checkout@v6
      - 
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - 
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gly-engine/haio:latest
